[project]
name = "mlpilot-backend"
version = "0.1.0"
description = "MLPilot Backend - Machine Learning Workflow Automation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "cloudpickle>=3.0.0",
    "openpyxl>=3.1.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.12.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
# N803/N806: scikit-learn style uppercase data variables (X_train, y_test) are idiomatic here
# B008: FastAPI requires Depends()/Query()/File() calls in argument defaults
ignore = ["N803", "N806", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
asyncio_mode = "auto"
